<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <!-- Comic Explosion Burst -->
  <defs>
    <filter id="burstShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#051329" />
    </filter>
  </defs>
  
  <g filter="url(#burstShadow)">
    <!-- Outer spiked layer (Dark Blue / Cyan rim) -->
    <path d="M160 8 L188 38 L228 22 L236 58 L278 62 L264 98 L298 120 L262 138 L276 172 L234 162 L220 196 L184 172 L160 200 L136 172 L100 196 L86 162 L44 172 L58 138 L22 120 L56 98 L42 62 L84 58 L92 22 L132 38 Z"
          fill="#00e5ff" stroke="#051329" stroke-width="5" stroke-linejoin="round"/>
          
    <!-- Inner spiked layer (White / Cream Starburst) -->
    <path d="M160 18 L183 45 L218 32 L224 64 L260 70 L246 101 L276 120 L245 135 L256 164 L221 154 L208 182 L179 162 L160 185 L141 162 L112 182 L99 154 L64 164 L75 135 L44 120 L74 101 L60 70 L96 64 L102 32 L137 45 Z"
          fill="#ffffff" stroke="#e63946" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <!-- Text: REGISTRATIONS (Curved Red) -->
  <path id="regPath" d="M 75 82 Q 160 48 245 80" fill="none" stroke="none" />
  <text font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="19" fill="#e63946" letter-spacing="3">
    <textPath href="#regPath" startOffset="50%" text-anchor="middle">
      REGISTRATIONS
    </textPath>
  </text>

  <!-- Text: OPEN! (Bold Angled Electric Blue) -->
  <g transform="rotate(-6 160 122)">
    <!-- Text shadow -->
    <text x="163" y="126" text-anchor="middle" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="46" fill="#051329" font-style="italic" letter-spacing="1.5">OPEN!</text>
    <!-- Foreground text -->
    <text x="160" y="123" text-anchor="middle" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="46" fill="#0055ff" font-style="italic" letter-spacing="1.5" stroke="#ffffff" stroke-width="2">OPEN!</text>
  </g>
</svg>
