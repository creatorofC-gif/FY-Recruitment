<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <defs>
    <!-- Somaiya Vidyavihar University Crest -->
    <g id="logo-somaiya-uni">
      <circle cx="20" cy="20" r="18" fill="#d90429" stroke="#ffffff" stroke-width="2"/>
      <path d="M20 7 L23 15 L32 15 L25 20 L27 29 L20 24 L13 29 L15 20 L8 15 L17 15 Z" fill="#ffffff" opacity="0.9"/>
      <circle cx="20" cy="20" r="14" fill="none" stroke="#ffbe0b" stroke-width="1.5" stroke-dasharray="3 2"/>
    </g>

    <!-- Somaiya Trust Badge -->
    <g id="logo-somaiya-trust">
      <rect x="0" y="0" width="85" height="34" rx="4" fill="#003566" stroke="#ffffff" stroke-width="1.5"/>
      <text x="42" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-weight="800" font-size="12" fill="#ffffff" font-style="italic">Somaiya</text>
      <text x="42" y="29" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="8" fill="#ffffff" letter-spacing="2.5">TRUST</text>
    </g>

    <!-- BloomBox 3D Cube Icon -->
    <g id="logo-bloombox-cube">
      <!-- Top Face -->
      <polygon points="25,5 45,16 25,27 5,16" fill="#00e5ff" stroke="#051329" stroke-width="2" stroke-linejoin="round"/>
      <!-- Left Face -->
      <polygon points="5,16 25,27 25,48 5,37" fill="#0077b6" stroke="#051329" stroke-width="2" stroke-linejoin="round"/>
      <!-- Right Face -->
      <polygon points="25,27 45,16 45,37 25,48" fill="#023e8a" stroke="#051329" stroke-width="2" stroke-linejoin="round"/>
      <!-- Inner 'B' Monograms -->
      <text x="15" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff">B</text>
      <text x="35" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#80e5ff">B</text>
    </g>

    <!-- Institution's Innovation Council Logo -->
    <g id="logo-iic">
      <circle cx="16" cy="16" r="15" fill="#f8f9fa" stroke="#051329" stroke-width="1.5"/>
      <circle cx="16" cy="11" r="5" fill="#fb5607"/>
      <path d="M8 26 C8 19, 24 19, 24 26 Z" fill="#0077b6"/>
      <circle cx="23" cy="9" r="3" fill="#ff006e"/>
      <circle cx="9" cy="9" r="3" fill="#ffbe0b"/>
    </g>
  </defs>
</svg>
